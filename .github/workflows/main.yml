name: Build w-Ai-de APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK and CMake
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache the compiled engine
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
          key: waide-cxx-${{ hashFiles('app/src/main/cpp/CMakeLists.txt') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/w-Ai-de.apk"
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: w-Ai-de-apk
          path: out/w-Ai-de.apk
          retention-days: 90
